  if (s.desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = s.desc;
    sec.appendChild(d);
  }

  const grid = document.createElement("div");
  grid.className = "entries";
  (s.entries || []).forEach(e => {
    const a = document.createElement("a");
    a.className = "entry";
    a.href = e.url;
    a.innerHTML = `<div class="icon">${e.icon || "📄"}</div><div class="txt"><div class="t">${e.title}</div><div class="d">${e.desc || ""}</div>${e.meta ? `<div class="m">${e.meta}</div>` : ""}</div>`;
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  app.appendChild(sec);
});
</script>
</body>
</html>
