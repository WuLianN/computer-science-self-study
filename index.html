  /* ===== 右下角停靠胶囊（根首页是自包含页，按约定自带内联 .dock 样式，对齐 assets/theme.css）=====

     正好适配 4560px 长的首页；滚过阈值才淡入。桌面隐藏，仅窄屏显示。 */
  .dock{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:none;flex-direction:column;align-items:center;gap:10px}

  .dock a.top{background:var(--primary);color:#fff;opacity:0;transform:translateY(8px) scale(.6);pointer-events:none}
  .dock.show-top a.top{opacity:1;transform:none;pointer-events:auto}
  .dock.show-top a.top:active{transform:scale(.9)}
  @media (max-width:640px){
    .dock{display:flex}
    /* 底部留白避免 ↑ 圆钮压住页脚（与 theme.css 的 body>.wrap 同一口径） */
    body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
    .hero{padding:16px 0 10px}
    .hero-card{padding:20px 16px 18px;border-radius:16px}

    .hero .stats .chip{flex:0 1 calc(50% - 4px);justify-content:center;min-height:44px;padding:7px 13px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .subject-head{gap:8px}

    .entry .txt .d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .entry .txt .m{display:none}

  @media (prefers-reduced-motion:reduce){

  }
  /* 打印/另存 PDF 不印出悬浮按钮 */
  @media print{.dock{display:none!important}}
</style>

const app = document.getElementById("app");
const nav = document.getElementById("subj-nav");
const statsSum = document.getElementById("stats-sum");

/* ===== 显示状态：默认取 subjects 的 hideByDefault，访客切换存 localStorage =====
   需要默认收起的科目在数组里打 hideByDefault:true；用户在设置框里的选择覆盖默认值、仅存本机。 */
const STORE_KEY = "cs-subjects-visibility";
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { prefs = {}; }

/* 某科目是否显示：prefs 里有用户选择就用它（false=隐藏），否则回落到默认 !hideByDefault */
function isShown(s) {
  return Object.prototype.hasOwnProperty.call(prefs, s.code) ? !!prefs[s.code] : !s.hideByDefault;
}
function visibleSubjects() { return subjects.filter(isShown); }
function savePrefs() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); } catch (e) {}
}

/* 主渲染：顶部 chip、统计、科目卡片都基于「当前可见科目」，一处切换三处同步 */
function render() {
  const list = visibleSubjects();
  const hiddenCount = subjects.length - list.length;
  nav.innerHTML = list.map(s =>
    `<a class="chip" href="#sub-${s.code}"><b>${s.icon || "📘"} ${s.name}</b><span>${s.code} · ${s.brief || "整理中"}</span></a>`
  ).join("");
  statsSum.textContent = `共 ${subjects.length} 个科目`
    + (hiddenCount ? ` · 已隐藏 ${hiddenCount} 门（点右上角 ⚙ 管理）` : "");

  app.innerHTML = "";
  list.forEach(s => {
    const sec = document.createElement("section");
    sec.className = "subject";
    sec.id = "sub-" + s.code;

    const head = document.createElement("div");
    head.className = "subject-head";
    head.innerHTML = `<span class="code">${s.code}</span><h2>${s.name}</h2>`;
    sec.appendChild(head);

    if (s.desc) {
      const d = document.createElement("div");
      d.className = "desc";
      d.textContent = s.desc;
      sec.appendChild(d);
    }

    const grid = document.createElement("div");
    grid.className = "entries";
    (s.entries || []).forEach(e => {
      const a = document.createElement("a");
      a.className = "entry";
      a.href = e.url;
      a.innerHTML = `<div class="icon">${e.icon || "📄"}</div><div class="txt"><div class="t">${e.title}</div><div class="d">${e.desc || ""}</div>${e.meta ? `<div class="m">${e.meta}</div>` : ""}</div>`;
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    app.appendChild(sec);
  });
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "subject";
    const d = document.createElement("div");
    d.className = "desc";
    d.style.margin = "0";
    d.textContent = "所有科目都已隐藏，点右上角 ⚙ 设置即可恢复显示。";
    empty.appendChild(d);
    app.appendChild(empty);
  }
  document.dispatchEvent(new Event('reading:render'));
}

/* ===== 设置弹窗 ===== */
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const modal = document.getElementById("settingsModal");
const listBox = document.getElementById("settingsList");
const stateBox = document.getElementById("settingsState");
const gear = document.getElementById("settingsBtn");

function renderSettings() {
  listBox.innerHTML = subjects.map(s => {
    const on = isShown(s);
    return `<button class="subj-toggle${on ? "" : " off"}" type="button" data-code="${s.code}" aria-pressed="${on}" aria-label="${on ? "隐藏" : "显示"} ${s.name}">`
      + `<span class="code-mini">${s.code}</span><span class="nm">${s.name}</span>`
      + `<span class="xicon">${on ? X_ICON : PLUS_ICON}</span></button>`;
  }).join("");
  stateBox.textContent = `当前显示 ${visibleSubjects().length} / ${subjects.length} 门`;
}
function openModal() {
  renderSettings();
  modal.hidden = false;
  modal.classList.add("open");
  gear.setAttribute("aria-expanded", "true");
  document.getElementById("settingsClose").focus();
}
function closeModal() {
  modal.classList.remove("open");
  modal.hidden = true;
  gear.setAttribute("aria-expanded", "false");
  gear.focus();
}

gear.addEventListener("click", () => modal.hidden ? openModal() : closeModal());
document.getElementById("settingsClose").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

listBox.addEventListener("click", e => {
  const btn = e.target.closest(".subj-toggle");
  if (!btn) return;
  const code = btn.dataset.code;
  const s = subjects.find(x => x.code === code);
  prefs[code] = !isShown(s);
  savePrefs();
  render();
  renderSettings();
});
document.getElementById("settingsReset").addEventListener("click", () => {
  prefs = {};
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  render();
  renderSettings();
});
