<script>
/* ============================================================

  {
    code: "02324",
    name: "离散数学",
    icon: "📐",
    brief: "14 页知识点 · 3 套真题",
    desc: "全国自考本科《离散数学》· 知识点详解与历年真题",
    entries: [
      {
        icon: "🔥",
        title: "考前抢分一页纸",
        desc: "三套真题逐题统计的核心考点频率表 + 6 个可默写模板",
        meta: "目标及格 60+ · 专为临考冲刺 · 支持打印/存 PDF",
        url: "discrete-mathematics-02324/考前抢分.html"
      },
      {
        icon: "📚",
        title: "知识点导航",
        desc: "数理逻辑 / 集合论与关系 / 代数系统 / 图论 四大板块 · 14 页详解",
        meta: "优先图示化 · 内嵌 SVG 与算法动画",
        url: "discrete-mathematics-02324/知识点/index.html"
      },
      {
        icon: "📝",
        title: "历年真题",
        desc: "3 套全国卷 · 每套含【真题详解】与【原卷扫描件】两个入口",
        meta: "2026.4 / 2025.10 / 2025.4 · 逐题复核",
        url: "discrete-mathematics-02324/真题/index.html"
      }
    ]
  },
  {
    code: "13013",
    name: "高级语言程序设计",
    icon: "🖥️",
    brief: "16 页知识点 · 2 套真题",
    desc: "全国自考本科《高级语言程序设计》（C 语言）· 16 页知识点 + 两套真题逐题详解 + 考前抢分一页纸",
    entries: [
      {
        icon: "🔥",
        title: "考前抢分一页纸",
        desc: "三套真题统计的必考清单 + 8 个可默写代码模板 + 12 个易错坑 + 考场策略",
        meta: "目标 60+ · 可打印带走",
        url: "high-level-programming-13013/考前抢分.html"
      },
      {
        icon: "📚",
        title: "知识点讲解（16 页全）",
        desc: "按郑岩《高级语言程序设计》（机械工业出版社 2017）10 章拆成 16 页：算法与 C 基础、数据类型、三种结构、数组与字符串、函数与存储类别、指针、结构体、预处理与文件",
        meta: "16 页 · 每页标出对应真题题号 · 代码全按 C89",

      },

  ,
  {
    code: "02325",
    name: "计算机系统结构",
    desc: "……",
    entries: [
      { icon: "📚", title: "知识点导航", desc: "……", url: "computer-system-architecture-02325/知识点/index.html" },

    ]
  }
  */
];

const app = document.getElementById("app");

/* 顶部科目快捷入口由 subjects 自动生成：以后新增科目只需改这个数组，不用动 HTML */
const nav = document.getElementById("subj-nav");
nav.innerHTML = subjects.map(s =>
  `<a class="chip" href="#sub-${s.code}"><b>${s.icon || "📘"} ${s.name}</b><span>${s.code} · ${s.brief || "整理中"}</span></a>`
).join("");
document.getElementById("stats-sum").textContent =
  `共 ${subjects.length} 个科目 · 30 页知识点 · 5 套真题详解 · 100+ SVG 图示`;

subjects.forEach(s => {
  const sec = document.createElement("section");
  sec.className = "subject";
  sec.id = "sub-" + s.code;

  const head = document.createElement("div");
  head.className = "subject-head";
  head.innerHTML = `<span class="code">${s.code}</span><h2>${s.name}</h2>`;
  sec.appendChild(head);

  if (s.desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = s.desc;
    sec.appendChild(d);
  }

  const grid = document.createElement("div");
  grid.className = "entries";
  (s.entries || []).forEach(e => {
    const a = document.createElement("a");
    a.className = "entry";
    a.href = e.url;
    a.innerHTML = `<div class="icon">${e.icon || "📄"}</div><div class="txt"><div class="t">${e.title}</div><div class="d">${e.desc || ""}</div>${e.meta ? `<div class="m">${e.meta}</div>` : ""}</div>`;
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  app.appendChild(sec);
});
</script>
