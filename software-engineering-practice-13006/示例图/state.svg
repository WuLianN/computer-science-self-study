<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">薪资单状态图</title><desc id="desc">单个薪资单从草稿到待审核，审核通过进入已审核，驳回回到草稿，支付成功进入已发放后结束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#1e293b;font-size:15px} .head{font-size:16px;font-weight:700;fill:#6d28d9} .label{font-size:14px;fill:#475569} .box{fill:#faf5ff;stroke:#a78bfa;stroke-width:1.5} .line{fill:none;stroke:#475569;stroke-width:1.5} .dashed{stroke-dasharray:6 5} .caption{font-size:14px;fill:#64748b}</style>
<rect width="100%" height="100%" fill="#fff"/>

<circle cx="32" cy="142" r="9" fill="#334155"/><path class="line" marker-end="url(#arrow)" d="M41 142H85"/>
<rect class="box" x="85" y="114" width="130" height="56" rx="15"/><text x="150" y="149" text-anchor="middle">草稿</text>
<rect class="box" x="310" y="114" width="140" height="56" rx="15"/><text x="380" y="149" text-anchor="middle">待审核</text>
<rect class="box" x="552" y="114" width="140" height="56" rx="15"/><text x="622" y="149" text-anchor="middle">已审核</text>
<rect class="box" x="552" y="278" width="140" height="56" rx="15"/><text x="622" y="313" text-anchor="middle">已发放</text>
<path class="line" marker-end="url(#arrow)" d="M215 142H310"/><text x="262" y="96" class="label" text-anchor="middle">提交 [资料完整]</text>
<path class="line" marker-end="url(#arrow)" d="M450 142H552"/><text x="501" y="129" class="label" text-anchor="middle">审核通过</text>
<path class="line" marker-end="url(#arrow)" d="M380 170V229H150V170"/><text x="265" y="220" class="label" text-anchor="middle">驳回 / 记录原因</text>
<path class="line" marker-end="url(#arrow)" d="M622 170V278"/><text x="635" y="232" class="label">支付成功</text>
<path class="line" marker-end="url(#arrow)" d="M692 306H724"/>
<circle class="line" cx="738" cy="306" r="13"/><circle fill="#334155" cx="738" cy="306" r="8"/>
<text x="30" y="365" class="caption">事件 [守卫条件] / 动作；这些状态、审批与支付规则均为本站自拟。</text>
<text x="30" y="390" class="caption">一次建模只观察一张薪资单，不能把页面跳转或部门名称当成对象状态。</text>

</svg>
